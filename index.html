<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hush Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: one centred card on the home screen, one full-height column (header, messages, composer) in a room. */
:root{
  --bg:#f2f6f4; --surface:#ffffff; --surface2:#e8efec; --fg:#0e1915; --muted:#5a6b64; --line:#d8e2dd;
  --accent:#0a9f7b; --accent-fg:#ffffff; --danger:#d4433b; --glow:rgba(10,159,123,.16); --nl:34%;
  --f-display:'Bricolage Grotesque',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(14,25,21,.06),0 12px 32px rgba(14,25,21,.08);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a100e; --surface:#121b18; --surface2:#1a2621; --fg:#e6f0ec; --muted:#8a9d95; --line:#24332c;
    --accent:#2fd4a6; --accent-fg:#04251c; --danger:#ff7a70; --glow:rgba(47,212,166,.14); --nl:72%;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a100e; --surface:#121b18; --surface2:#1a2621; --fg:#e6f0ec; --muted:#8a9d95; --line:#24332c;
  --accent:#2fd4a6; --accent-fg:#04251c; --danger:#ff7a70; --glow:rgba(47,212,166,.14); --nl:72%;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

/* ---------- Home ---------- */
.home{min-height:100%;display:grid;place-items:center;padding:24px 16px;
  background:radial-gradient(60rem 30rem at 50% -10%,var(--glow),transparent 70%)}
.card{width:100%;max-width:25rem;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px 24px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:20px}
.brand{font:700 2.4rem/1 var(--f-display);letter-spacing:-.03em;margin:0}
.brand i{color:var(--accent);font-style:normal}
.tag{margin:6px 0 0;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none;transition:border-color .15s}
.input:focus{border-color:var(--accent)}
.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:600;background:var(--accent);color:var(--accent-fg);transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--surface2);color:var(--fg)}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:.8rem}
.or::before,.or::after{content:"";height:1px;background:var(--line);flex:1}
.joinrow{display:flex;gap:8px}
.code{font-family:var(--f-mono);font-weight:700;letter-spacing:.35em;text-transform:uppercase;text-align:center;padding-left:calc(14px + .35em)}
.joinrow .btn{flex:none}
.fine{margin:0;font-size:.8rem;color:var(--muted);text-align:center}
.theme-fab{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:16px}

/* ---------- Icon buttons ---------- */
.ib{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);background:var(--surface);flex:none}
.ib:hover{background:var(--surface2)}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib .moon{display:none}
:root[data-theme="dark"] .ib .sun{display:none}
:root[data-theme="dark"] .ib .moon{display:block}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .ib .sun{display:none}
  :root:not([data-theme="light"]) .ib .moon{display:block}
}

/* ---------- Chat ---------- */
.chat{height:100%;display:flex;flex-direction:column;max-width:52rem;margin:0 auto;background:var(--bg)}
@media (min-width:900px){.chat{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.bar{display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line);background:var(--surface);position:relative}
.chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:7px 10px;min-width:0}
.chip b{font-family:var(--f-mono);letter-spacing:.2em;font-size:.95rem}
.chip small{color:var(--muted);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.spacer{flex:1}
.timer{font-family:var(--f-mono);font-weight:700;font-variant-numeric:tabular-nums;padding:8px 10px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-size:.9rem}
.timer.low{color:var(--danger);border-color:var(--danger)}
.members{position:relative}
.mbtn{display:flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-variant-numeric:tabular-nums}
.pop{position:absolute;right:0;top:46px;z-index:20;min-width:12rem;max-width:80vw;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:8px;display:flex;flex-direction:column;gap:2px}
.pop div{padding:7px 10px;border-radius:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pop div span{color:var(--muted);font-size:.8rem}
.meter{position:absolute;left:0;bottom:-1px;height:2px;background:var(--accent);width:100%;transform-origin:left;transition:transform 1s linear}

.feed{flex:1;min-height:0;overflow-y:auto;padding:16px 12px;display:flex;flex-direction:column;gap:6px;overscroll-behavior:contain}
.sys{align-self:center;color:var(--muted);font-size:.78rem;padding:4px 10px;border-radius:99px;background:var(--surface2);text-align:center;max-width:90%}
.msg{max-width:min(80%,34rem);display:flex;flex-direction:column;gap:3px;min-width:0}
.msg .who{font-size:.75rem;font-weight:600;color:hsl(var(--h) 62% var(--nl));padding:0 4px}
.bub{background:var(--surface);border:1px solid var(--line);border-radius:16px 16px 16px 5px;padding:8px 12px;overflow-wrap:anywhere;white-space:pre-wrap;min-width:0}
.bub.emoji-only{font-size:2.2rem;line-height:1.15;background:transparent;border-color:transparent;padding:0 4px}
.bub img{display:block;max-width:100%;max-height:22rem;border-radius:11px;cursor:zoom-in}
.bub.imgb{padding:4px}
.time{font-size:.68rem;color:var(--muted);padding:0 4px;font-variant-numeric:tabular-nums}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg.me .bub{background:var(--accent);color:var(--accent-fg);border-color:transparent;border-radius:16px 16px 5px 16px}
.msg.me .bub.emoji-only{background:transparent;color:inherit}

.composer{padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface);display:flex;align-items:flex-end;gap:8px;position:relative}
.composer textarea{flex:1;min-width:0;resize:none;max-height:8rem;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 14px;outline:none;line-height:1.4}
.composer textarea:focus{border-color:var(--accent)}
.send{width:40px;height:40px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;flex:none}
.send svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.send:disabled,.ib:disabled{opacity:.45;cursor:not-allowed}
.emojis{position:absolute;left:12px;bottom:calc(64px + env(safe-area-inset-bottom,0px));width:min(21rem,calc(100% - 24px));max-height:15rem;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:8px;display:grid;grid-template-columns:repeat(8,1fr);gap:2px;z-index:15}
.emojis button{border:0;background:transparent;font-size:1.35rem;padding:5px 0;border-radius:8px}
.emojis button:hover{background:var(--surface2)}

.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.86);display:grid;place-items:center;padding:16px;z-index:50;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;border-radius:10px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.88rem;z-index:60;max-width:calc(100% - 32px);text-align:center}
.over{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;z-index:40}
.over .card{text-align:center;align-items:stretch}
.over h2{font:700 1.5rem var(--f-display);margin:0;letter-spacing:-.02em}
.over p{margin:0;color:var(--muted)}
@media (max-width:420px){.chip small{display:none}.bar{gap:6px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<!-- HOME -->
<main class="home" id="home">
  <button class="ib theme-fab" data-theme-toggle aria-label="Switch light or dark theme">
    <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
  <div class="card">
    <div>
      <h1 class="brand">hush<i>.</i></h1>
      <p class="tag">Chats that last 30 minutes and leave no trace.</p>
    </div>
    <div class="field">
      <label for="name">Your name</label>
      <input class="input" id="name" maxlength="20" autocomplete="nickname" placeholder="e.g. Priya">
    </div>
    <button class="btn" id="create">Start a new room</button>
    <div class="or">or join with a code</div>
    <form class="joinrow" id="joinForm">
      <input class="input code" id="code" maxlength="6" inputmode="text" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="K7P2QX" aria-label="6 character room code">
      <button class="btn ghost" type="submit">Join</button>
    </form>
    <p class="fine">Peer to peer. No server keeps your messages. Up to 10 people per room.</p>
  </div>
</main>

<!-- CHAT -->
<section class="chat" id="chat" hidden>
  <header class="bar">
    <button class="chip" id="copyCode" title="Copy invite link" style="cursor:pointer"><small>Room</small><b id="roomCode">------</b></button>
    <div class="spacer"></div>
    <div class="timer" id="timer" aria-label="Time left">30:00</div>
    <div class="members">
      <button class="mbtn" id="mbtn" aria-expanded="false" aria-label="Show members">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5M16 5.2a3 3 0 0 1 0 5.6M18 14.8c1.9.6 3 2.2 3 5.2"/></svg>
        <span id="mcount">1/10</span>
      </button>
      <div class="pop" id="pop" hidden></div>
    </div>
    <button class="ib" data-theme-toggle aria-label="Switch light or dark theme">
      <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <button class="ib" id="leave" aria-label="Leave room">
      <svg viewBox="0 0 24 24"><path d="M9 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h4M16 8l4 4-4 4M20 12H9"/></svg>
    </button>
    <div class="meter" id="meter"></div>
  </header>

  <div class="feed" id="feed" aria-live="polite"></div>

  <form class="composer" id="composer">
    <div class="emojis" id="emojis" hidden></div>
    <button class="ib" type="button" id="emojiBtn" aria-label="Emoji">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5a4.5 4.5 0 0 0 7 0M9 9.5h.01M15 9.5h.01"/></svg>
    </button>
    <button class="ib" type="button" id="imgBtn" aria-label="Send an image">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="m21 16-5-5-8 8"/></svg>
    </button>
    <input type="file" id="file" accept="image/*" hidden>
    <textarea id="text" rows="1" maxlength="2000" placeholder="Message" aria-label="Message"></textarea>
    <button class="send" type="submit" id="sendBtn" aria-label="Send">
      <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </form>
</section>

<script type="module">
/* ============ Config ============ */
const APP_ID = 'hush-room-v1';
const SESSION_MS = 30 * 60 * 1000;
const MAX_MEMBERS = 10;
const TRYSTERO_URL = 'https://cdn.jsdelivr.net/npm/trystero@0.21.5/+esm';
const ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // no 0/O/1/I

const $ = (id) => document.getElementById(id);
const safe = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k,v){ try { localStorage.setItem(k,v); return true; } catch { return false; } },
  del(k){ try { localStorage.removeItem(k); } catch {} }
};

/* ============ Theme ============ */
function applyTheme(t){ if (t) document.documentElement.setAttribute('data-theme', t); }
applyTheme(safe.get('hush:theme'));
document.querySelectorAll('[data-theme-toggle]').forEach(b => b.addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') ||
    (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  applyTheme(next); safe.set('hush:theme', next);
}));

/* ============ Helpers ============ */
function toast(msg){
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2800);
}
function newCode(){
  const a = new Uint32Array(6); crypto.getRandomValues(a);
  return Array.from(a, n => ALPHABET[n % ALPHABET.length]).join('');
}
function uid(){ return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }
function hueOf(s){ let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
function fmtTime(ts){ return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }
function cleanName(n){ return (n || '').replace(/\s+/g, ' ').trim().slice(0, 20); }
function purgeExpired(){
  try {
    for (let i = localStorage.length - 1; i >= 0; i--) {
      const k = localStorage.key(i);
      if (k && k.startsWith('hush:room:')) {
        const d = JSON.parse(localStorage.getItem(k) || '{}');
        if (!d.roomStart || d.roomStart + SESSION_MS < Date.now()) localStorage.removeItem(k);
      }
    }
  } catch {}
}
purgeExpired();

/* ============ Home wiring ============ */
const nameInput = $('name'), codeInput = $('code');
nameInput.value = safe.get('hush:name') || '';
codeInput.addEventListener('input', () => { codeInput.value = codeInput.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); });
const hashCode = (location.hash || '').replace('#', '').toUpperCase();
if (/^[A-Z0-9]{6}$/.test(hashCode)) codeInput.value = hashCode;

$('create').addEventListener('click', () => start(newCode(), true));
$('joinForm').addEventListener('submit', (e) => {
  e.preventDefault();
  if (!/^[A-Z0-9]{6}$/.test(codeInput.value)) { toast('Enter the 6 character room code.'); codeInput.focus(); return; }
  start(codeInput.value, false);
});

/* ============ Room state ============ */
let trystero = null, room = null, sendHello, sendMsg, sendImg;
let myName = '', code = '', roomStart = null, ended = false, tickId = null, joinedAt = 0, startFallback = null;
const peers = new Map();       // id -> { name, joinedAt }
const announced = new Set();
let messages = [];             // { id, who, name, text?, img?, ts, me }
let warned5 = false, warned1 = false;
let selfId = 'self';

async function loadTrystero(){
  if (trystero) return trystero;
  trystero = await import(TRYSTERO_URL);
  selfId = trystero.selfId;
  return trystero;
}

async function start(roomCode, creator, silentName){
  myName = cleanName(nameInput.value) || silentName || ('Guest-' + newCode().slice(0, 2));
  nameInput.value = myName;
  safe.set('hush:name', myName);
  let t;
  try { t = await loadTrystero(); }
  catch { toast('Could not load the connection library. Check your internet and try again.'); return; }

  code = roomCode; ended = false; peers.clear(); announced.clear(); messages = [];
  warned5 = warned1 = false; joinedAt = Date.now(); roomStart = null;

  const saved = safe.get('hush:room:' + code);
  if (saved) {
    try {
      const d = JSON.parse(saved);
      if (d.roomStart && d.roomStart + SESSION_MS > Date.now()) { roomStart = d.roomStart; messages = d.messages || []; }
    } catch {}
  }
  if (creator && !roomStart) roomStart = Date.now();

  try { room = t.joinRoom({ appId: APP_ID }, code); }
  catch { toast('Could not open the room. Try again.'); return; }

  const h = room.makeAction('hello'), m = room.makeAction('msg'), i = room.makeAction('img');
  sendHello = h[0]; sendMsg = m[0]; sendImg = i[0];

  h[1]((d, id) => onHello(d, id));
  m[1]((d, id) => { if (allowed(id) && d && typeof d.text === 'string') addMessage({ id: d.id, who: id, name: peerName(id, d.name), text: d.text.slice(0, 2000), ts: d.ts, me: false }); });
  i[1]((d, id) => {
    if (allowed(id) && d && typeof d.img === 'string' && d.img.startsWith('data:image/jpeg;base64,'))
      addMessage({ id: d.id, who: id, name: peerName(id, d.name), img: d.img, ts: d.ts, me: false });
  });
  room.onPeerJoin((id) => { sendHello(helloData(), id); });
  room.onPeerLeave((id) => {
    const p = peers.get(id); peers.delete(id); announced.delete(id);
    if (p) sys(p.name + ' left');
    renderMembers();
  });

  safe.set('hush:active', JSON.stringify({ code, name: myName }));
  history.replaceState(null, '', '#' + code);
  $('home').hidden = true; $('chat').hidden = false;
  $('roomCode').textContent = code;
  $('feed').innerHTML = '';
  messages.forEach(renderMessage);
  sys(creator ? 'Room created. Share the code or tap it to copy the invite link.' : 'Connecting to the room…');
  renderMembers(); updateTimer();
  clearInterval(tickId); tickId = setInterval(updateTimer, 1000);
  clearTimeout(startFallback);
  if (!roomStart) startFallback = setTimeout(() => { if (!roomStart && !ended) { roomStart = Date.now(); sys('You are the first one here. The 30 minute timer has started.'); persist(); updateTimer(); } }, 6000);
  persist();
}

function helloData(){ return { name: myName, joinedAt, roomStart }; }
function peerName(id, fallback){ return (peers.get(id) && peers.get(id).name) || cleanName(fallback) || 'Guest'; }

function memberOrder(){
  const all = [{ id: selfId, joinedAt }, ...[...peers].map(([id, p]) => ({ id, joinedAt: p.joinedAt }))];
  return all.sort((a, b) => a.joinedAt - b.joinedAt || (a.id < b.id ? -1 : 1));
}
function allowed(id){ return memberOrder().slice(0, MAX_MEMBERS).some(m => m.id === id); }

function onHello(d, id){
  if (!d || ended) return;
  const name = cleanName(d.name) || 'Guest';
  const first = !announced.has(id);
  peers.set(id, { name, joinedAt: Number(d.joinedAt) || Date.now() });
  if (d.roomStart && (!roomStart || d.roomStart < roomStart)) {
    roomStart = d.roomStart; clearTimeout(startFallback); persist(); updateTimer();
  }
  const order = memberOrder();
  if (order.findIndex(m => m.id === selfId) >= MAX_MEMBERS) { leaveRoom('This room is full (10 people max).'); return; }
  if (first) { announced.add(id); sys(name + ' joined'); sendHello(helloData(), id); }
  renderMembers();
}

/* ============ Rendering ============ */
function sys(text){
  const el = document.createElement('div'); el.className = 'sys'; el.textContent = text;
  $('feed').appendChild(el); scrollDown();
}
function scrollDown(){ const f = $('feed'); f.scrollTop = f.scrollHeight; }
let lastWho = null;
function renderMessage(m){
  const wrap = document.createElement('div'); wrap.className = 'msg' + (m.me ? ' me' : '');
  wrap.style.setProperty('--h', hueOf(m.name || ''));
  if (!m.me && lastWho !== m.who) { const w = document.createElement('div'); w.className = 'who'; w.textContent = m.name; wrap.appendChild(w); }
  const b = document.createElement('div'); b.className = 'bub';
  if (m.img) {
    b.classList.add('imgb');
    const im = document.createElement('img'); im.src = m.img; im.alt = 'Image from ' + m.name;
    im.addEventListener('click', () => openLightbox(m.img));
    b.appendChild(im);
  } else {
    b.textContent = m.text;
    if (/^(\p{Extended_Pictographic}|\p{Emoji_Modifier}|‍|️|\s){1,6}$/u.test(m.text) && /\p{Extended_Pictographic}/u.test(m.text)) b.classList.add('emoji-only');
  }
  wrap.appendChild(b);
  const t = document.createElement('div'); t.className = 'time'; t.textContent = fmtTime(m.ts); wrap.appendChild(t);
  $('feed').appendChild(wrap); lastWho = m.who; scrollDown();
}
function addMessage(m){
  if (messages.some(x => x.id === m.id)) return;
  messages.push(m); renderMessage(m); persist();
}
function renderMembers(){
  const total = peers.size + 1;
  $('mcount').textContent = total + '/' + MAX_MEMBERS;
  const pop = $('pop'); pop.innerHTML = '';
  const add = (n, you) => { const d = document.createElement('div'); d.textContent = n; if (you) { const s = document.createElement('span'); s.textContent = ' (you)'; d.appendChild(s); } pop.appendChild(d); };
  add(myName, true); peers.forEach(p => add(p.name, false));
}
$('mbtn').addEventListener('click', () => {
  const p = $('pop'); p.hidden = !p.hidden; $('mbtn').setAttribute('aria-expanded', String(!p.hidden));
});
document.addEventListener('click', (e) => { if (!e.target.closest('.members')) { $('pop').hidden = true; } if (!e.target.closest('.composer')) $('emojis').hidden = true; });

function openLightbox(src){
  const lb = document.createElement('div'); lb.className = 'lightbox';
  const im = document.createElement('img'); im.src = src; lb.appendChild(im);
  lb.addEventListener('click', () => lb.remove()); document.body.appendChild(lb);
}

/* ============ Timer ============ */
function updateTimer(){
  const t = $('timer'), meter = $('meter');
  if (!roomStart) { t.textContent = '--:--'; meter.style.transform = 'scaleX(1)'; return; }
  const left = roomStart + SESSION_MS - Date.now();
  if (left <= 0) { endSession(); return; }
  const mm = String(Math.floor(left / 60000)).padStart(2, '0');
  const ss = String(Math.floor(left / 1000) % 60).padStart(2, '0');
  t.textContent = mm + ':' + ss;
  t.classList.toggle('low', left < 5 * 60000);
  meter.style.transform = 'scaleX(' + (left / SESSION_MS).toFixed(4) + ')';
  if (left < 5 * 60000 && !warned5) { warned5 = true; sys('5 minutes left. This room and its messages will be cleared.'); }
  if (left < 60000 && !warned1) { warned1 = true; sys('1 minute left.'); }
}

/* ============ Persist (this device only) ============ */
let persistT = null;
function persist(){
  clearTimeout(persistT);
  persistT = setTimeout(() => {
    if (!code || ended || !roomStart) return;
    const key = 'hush:room:' + code;
    let list = messages.slice(-200);
    while (true) {
      if (safe.set(key, JSON.stringify({ roomStart, messages: list }))) return;
      const idx = list.findIndex(m => m.img);
      if (idx === -1) return;
      list = list.slice(idx + 1);
    }
  }, 400);
}

/* ============ Sending ============ */
const text = $('text');
text.addEventListener('input', () => { text.style.height = 'auto'; text.style.height = Math.min(text.scrollHeight, 128) + 'px'; });
text.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('composer').requestSubmit(); } });
$('composer').addEventListener('submit', (e) => {
  e.preventDefault();
  const v = text.value.trim(); if (!v || ended) return;
  const msg = { id: uid(), name: myName, text: v, ts: Date.now() };
  try { sendMsg(msg); } catch {}
  addMessage({ ...msg, who: selfId, me: true });
  text.value = ''; text.style.height = 'auto'; $('emojis').hidden = true;
});

const EMOJIS = Array.from('😀😃😄😁😆😅😂🤣🙂😉😊😍🥰😘😋😎🤩🥳😏🤔🤨😐😴🥱😮😢😭😤😡🤯😱🥶🥵🤗🫡🙄😬🤝👍👎👏🙌🙏💪👀🔥✨💯🎉🎂❤️🧡💛💚💙💜🖤💔🌹🌞🌙⭐☕🍕🍔🍟🍿🍩🍫🍻🥂✈️🏖️🚗📍📸🎵🎶🎮⚽🏏💼💸📌✅❌⚠️😇🤭🤫🥺😜😝🤪🫶');
const eg = $('emojis');
EMOJIS.forEach(em => { const b = document.createElement('button'); b.type = 'button'; b.textContent = em; b.addEventListener('click', () => {
  const s = text.selectionStart ?? text.value.length, e = text.selectionEnd ?? s;
  text.value = text.value.slice(0, s) + em + text.value.slice(e); text.focus(); const p = s + em.length; text.setSelectionRange(p, p);
}); eg.appendChild(b); });
$('emojiBtn').addEventListener('click', (e) => { e.stopPropagation(); eg.hidden = !eg.hidden; });

$('imgBtn').addEventListener('click', () => $('file').click());
$('file').addEventListener('change', async (e) => { const f = e.target.files[0]; e.target.value = ''; if (f) await shareImage(f); });
text.addEventListener('paste', async (e) => {
  const f = [...(e.clipboardData?.files || [])].find(x => x.type.startsWith('image/'));
  if (f) { e.preventDefault(); await shareImage(f); }
});

async function compress(file){
  const bmp = await createImageBitmap(file);
  let max = 1100, q = 0.72, url = '';
  for (let n = 0; n < 4; n++) {
    const s = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(bmp.width * s)); c.height = Math.max(1, Math.round(bmp.height * s));
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(bmp, 0, 0, c.width, c.height);
    url = c.toDataURL('image/jpeg', q);
    if (url.length < 450000) break;
    max *= 0.78; q = Math.max(0.5, q - 0.08);
  }
  bmp.close && bmp.close();
  return url;
}
async function shareImage(file){
  if (ended) return;
  if (!file.type.startsWith('image/')) { toast('Pick an image file.'); return; }
  try {
    const img = await compress(file);
    const msg = { id: uid(), name: myName, img, ts: Date.now() };
    try { sendImg(msg); } catch {}
    addMessage({ ...msg, who: selfId, me: true });
  } catch { toast('Could not read that image.'); }
}

/* ============ Leaving / ending ============ */
$('copyCode').addEventListener('click', async () => {
  const link = location.origin + location.pathname + '#' + code;
  try { await navigator.clipboard.writeText(link); toast('Invite link copied.'); }
  catch { toast('Room code: ' + code); }
});
$('leave').addEventListener('click', () => leaveRoom());

function teardown(){
  clearInterval(tickId); clearTimeout(startFallback);
  try { room && room.leave(); } catch {}
  room = null;
  safe.del('hush:active');
  if (code) safe.del('hush:room:' + code);
  messages = []; lastWho = null; peers.clear(); announced.clear();
  $('pop').hidden = true; $('emojis').hidden = true;
}
function showOverlay(title, body){
  const o = document.createElement('div'); o.className = 'over';
  o.innerHTML = '<div class="card"><h2></h2><p></p><button class="btn">Back to start</button></div>';
  o.querySelector('h2').textContent = title; o.querySelector('p').textContent = body;
  o.querySelector('button').addEventListener('click', () => { o.remove(); backHome(); });
  document.body.appendChild(o);
}
function backHome(){
  $('chat').hidden = true; $('home').hidden = false; $('feed').innerHTML = '';
  history.replaceState(null, '', location.pathname); codeInput.value = '';
}
function leaveRoom(reason){
  ended = true; teardown();
  if (reason) showOverlay('Left the room', reason); else backHome();
}
function endSession(){
  if (ended) return;
  ended = true; teardown();
  showOverlay('Time is up', 'This room has closed and the chat has been cleared from this device.');
}
addEventListener('beforeunload', () => { try { room && room.leave(); } catch {} });

/* ============ Rejoin after refresh ============ */
(function resume(){
  const a = safe.get('hush:active'); if (!a) return;
  try {
    const { code: c, name } = JSON.parse(a);
    const d = JSON.parse(safe.get('hush:room:' + c) || 'null');
    if (c && d && d.roomStart && d.roomStart + SESSION_MS > Date.now()) { nameInput.value = name || nameInput.value; start(c, false, name); }
    else { safe.del('hush:active'); }
  } catch { safe.del('hush:active'); }
})();
</script>
